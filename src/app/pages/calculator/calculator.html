<ion-header class="ion-no-border">
  <ion-toolbar mode="md">
    <div class="flex justify-between items-center px-4 py-2 bg-[var(--brand-dark)]">
      <div class="flex items-center">
        <img src="logo.png" alt="Arithmaxa" class="h-9 w-9 object-contain" />
      </div>
      <div class="flex items-center gap-1">
        <!-- Scientific-mode toggle, moved up from the keypad's own sub-toolbar
             (it was the only button left there once clear/backspace moved into
             the grid) — calculator-outline reads immediately as "more
             calculator functions", and doesn't look like a second, identical
             Tools button next to grid-outline. -->
        <ion-button class="header-icon-btn" [class.active]="calc.isScientific()" fill="clear" (click)="calc.toggleScientific()">
          <ion-icon name="calculator-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button class="header-icon-btn" fill="clear" (click)="toggleHistory(true)">
          <ion-icon name="time-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button class="header-icon-btn" fill="clear" (click)="goToTools()">
          <ion-icon name="grid-outline" slot="icon-only"></ion-icon>
        </ion-button>
        <ion-button class="header-icon-btn accent" fill="clear" (click)="goToAi()">
          <ion-icon name="sparkles-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
<ion-content class="calc-content" [scrollY]="false">
  <div class="flex flex-col h-full bg-[var(--brand-dark)]">
    <app-display class="shrink-0"></app-display>
    <app-keypad class="flex-1 min-h-0"></app-keypad>
  </div>
</ion-content>
