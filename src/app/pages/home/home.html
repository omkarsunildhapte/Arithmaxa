<ion-content class="home-content" [scrollY]="false">
  <div class="welcome-container">
    <div class="header-section animate-fade-in">
      <div class="logo-wrapper">
        <img src="logo.png" class="logo-img" alt="Arithmaxa Logo" />
      </div>
      <h1 class="app-title">Arithmaxa</h1>
      <p class="app-subtitle">Precision &amp; Power</p>
    </div>

    <div class="onboarding-container">
      <swiper-container #swiperEl init="false" slides-per-view="1" loop="true" autoplay-delay="3000" pagination="true" pagination-clickable="true">
        @for (slide of slides; track slide.title) {
          <swiper-slide>
            <div class="slide-content animate-fade-in">
              <div class="slide-image-wrapper">
                <img [src]="slide.image" [alt]="slide.title" class="slide-image" />
              </div>
              <div class="slide-text">
                <h2 class="slide-title" [innerHTML]="slide.htmlTitle"></h2>
                <p class="slide-desc">{{ slide.description }}</p>
              </div>
            </div>
          </swiper-slide>
        }
      </swiper-container>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-section">
    <ion-button fill="clear" class="explore-btn" (click)="goToCalculator()">
      <span>Explore Now</span>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </ion-button>
    <div class="legal-links">
      <a routerLink="/privacy" class="legal-link">Privacy Policy</a>
      <span class="link-sep">·</span>
      <a routerLink="/terms" class="legal-link">Terms of Service</a>
      <span class="link-sep">·</span>
      <ion-button fill="clear" class="legal-link feedback-trigger" (click)="openFeedback()">
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
        Feedback
      </ion-button>
    </div>
  </div>
</ion-footer>
