<ion-content class="home-content" [scrollY]="false">
  <div class="welcome-container">
    <ion-button fill="clear" class="skip-btn" (click)="goToCalculator()">Skip</ion-button>
    <div class="header-section animate-fade-in">
      <div class="logo-wrapper">
        <img src="logo.png" class="logo-img" alt="Arithmaxa Logo" />
      </div>
      <h1 class="app-title">Arithmaxa</h1>
      <p class="app-subtitle">Precision &amp; Power</p>
    </div>

    <div class="onboarding-container">
      <!-- loop is off (and autoplay stops on the last slide) so the carousel
           has a real end for the footer's "Next" → "Explore Now" switch to
           key off; with looping there is no last slide to detect. -->
      <swiper-container
        #swiperEl
        init="false"
        slides-per-view="1"
        loop="false"
        autoplay-delay="3000"
        autoplay-stop-on-last-slide="true"
        pagination="true"
        pagination-clickable="true"
        (swiperslidechange)="onSlideChange()"
      >
        @for (slide of slides; track slide.title) {
          <swiper-slide>
            <div class="slide-content animate-fade-in">
              <div class="slide-text">
                <h2 class="slide-title" [innerHTML]="slide.htmlTitle"></h2>
                <p class="slide-desc">{{ slide.description }}</p>
              </div>
            </div>
          </swiper-slide>
        }
      </swiper-container>
    </div>
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <div class="footer-section">
    <ion-button fill="clear" class="explore-btn" (click)="primaryAction()">
      <span>{{ isLastSlide() ? 'Explore Now' : 'Next' }}</span>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </ion-button>
    <div class="legal-links">
      <a [href]="privacyPolicyUrl" target="_blank" rel="noopener noreferrer" class="legal-link">Privacy Policy</a>
      <span class="link-sep">·</span>
      <a [href]="termsOfServiceUrl" target="_blank" rel="noopener noreferrer" class="legal-link">Terms of Service</a>
      <span class="link-sep">·</span>
      <ion-button fill="clear" class="legal-link feedback-trigger" (click)="openFeedback()">Feedback</ion-button>
    </div>
  </div>
</ion-footer>
