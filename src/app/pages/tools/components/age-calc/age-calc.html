<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="dismiss()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
    <div class="header-container">
      <span class="header-title">Age Calculator</span>
    </div>
  </ion-toolbar>
</ion-header>
<ion-content class="tool-modal-content">
  <div class="tool-view animate-fade-in px-5 pb-10">
    <!-- Input Card -->
    <div class="premium-card !m-0 !mb-4">
      <span class="text-[10px] uppercase tracking-widest text-[#94a3b8] font-bold block mb-4">Date of Birth</span>
      <ion-input type="date" [(ngModel)]="birthDate" (ionChange)="calculate()" class="huge-input text-4xl"></ion-input>
    </div>

    <!-- Timeline Bridge -->
    <div class="flex justify-center -my-6 relative z-10">
      <div class="w-12 h-12 rounded-full bg-[#8b5cf6] border-4 border-[#050505] flex items-center justify-center shadow-[0_0_20px_rgba(139,92,246,0.4)]">
        <ion-icon name="calendar-outline" class="text-white text-xl"></ion-icon>
      </div>
    </div>

    <!-- Result Card -->
    @if (ageResult(); as age) {
      <div class="premium-card !m-0 !mt-4 border-[#8b5cf6]/20 bg-[#8b5cf6]/5">
        <span class="text-[10px] uppercase tracking-widest text-[#8b5cf6] font-bold block mb-2">Calculated Age</span>

        <div class="flex flex-col items-center py-4">
          <div class="flex items-baseline gap-2">
            <span class="text-7xl font-black text-white">{{ age.years }}</span>
            <span class="text-xs uppercase tracking-widest text-[#8b5cf6] font-bold">Years</span>
          </div>

          <div class="flex gap-8 mt-8 w-full justify-center pt-6 border-t border-[#8b5cf6]/10">
            <div class="flex flex-col items-center">
              <span class="text-2xl font-bold text-white">{{ age.months }}</span>
              <span class="text-[9px] uppercase tracking-widest text-[#94a3b8]">Months</span>
            </div>
            <div class="flex flex-col items-center">
              <span class="text-2xl font-bold text-white">{{ age.days }}</span>
              <span class="text-[9px] uppercase tracking-widest text-[#94a3b8]">Days</span>
            </div>
          </div>
        </div>
      </div>
    } @else {
      <div class="premium-card !m-0 !mt-4 opacity-20 border-dashed">
        <div class="py-12 text-center">
          <p class="text-sm font-medium">Please select your birth date</p>
        </div>
      </div>
    }
  </div>
</ion-content>

<ion-footer class="ion-no-border">
  <ion-toolbar class="bg-black"> </ion-toolbar>
</ion-footer>
