<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="modal-topbar">
      <span class="modal-title">Share Feedback</span>
      <button class="close-btn" (click)="close()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="feedback-content">

  @if (submitted()) {
    <div class="success-state animate-fade-in">
      <div class="success-ring">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3 class="success-title">Thank you!</h3>
      <p class="success-desc">Your feedback helps us make Arithmaxa better.</p>
    </div>
  } @else {
    <div class="feedback-body">

      <!-- Star Rating -->
      <div class="fb-section">
        <label class="fb-label">How would you rate Arithmaxa?</label>
        <div class="stars-row">
          @for (i of stars; track i) {
            <button
              class="star-btn"
              (click)="setRating(i)"
              (mouseenter)="setHover(i)"
              (mouseleave)="clearHover()"
              [attr.aria-label]="i + ' star'">
              <ion-icon
                [name]="isStarFilled(i) ? 'star' : 'star-outline'"
                [class.star-filled]="isStarFilled(i)">
              </ion-icon>
            </button>
          }
        </div>
        <div class="rating-labels">
          <span>Poor</span>
          <span>Excellent</span>
        </div>
      </div>

      <!-- Category -->
      <div class="fb-section">
        <label class="fb-label">What's this about?</label>
        <div class="categories-grid">
          @for (cat of categories; track cat.value) {
            <button
              class="cat-btn"
              [class.active]="category() === cat.value"
              (click)="setCategory(cat.value)">
              <span class="cat-emoji">{{ cat.emoji }}</span>
              <span class="cat-label">{{ cat.label }}</span>
            </button>
          }
        </div>
      </div>

      <!-- Message -->
      <div class="fb-section">
        <label class="fb-label">
          Tell us more
          <span class="fb-label-hint">(min 5 characters)</span>
        </label>
        <textarea
          class="fb-textarea"
          [value]="message()"
          (input)="setMessage($any($event.target).value)"
          placeholder="What do you love? What could be better?"
          rows="4"
          maxlength="600">
        </textarea>
        <div class="char-count" [class.near-limit]="message().length > 540">
          {{ message().length }} / 600
        </div>
      </div>

      <!-- Submit -->
      <button
        class="submit-btn"
        [disabled]="!canSubmit() || isSubmitting()"
        (click)="submit()">
        @if (isSubmitting()) {
          <span class="submitting-dots">Sending</span>
        } @else {
          <ion-icon name="paper-plane-outline"></ion-icon>
          <span>Submit Feedback</span>
        }
      </button>

      <p class="privacy-note">Feedback is stored only on your device and never transmitted.</p>

    </div>
  }

</ion-content>
